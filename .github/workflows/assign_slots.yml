name: Assign blocks to pending claims

# The system picks the block; the claimant never does. After a claim merges,
# this places every pending claim in settlement order — (block number,
# transaction index) of its USDC transfer on Base — into the lowest free block
# its payment covers, and opens the assignment pull request: the claim files
# removed, ledger/w1/<slot_id>.json (+ icon, + soul manifest) added, the
# generated state regenerated. The base-branch verifier re-derives the same
# placement on that PR (verify_assignment), so the bot cannot place a claim
# anywhere but where the rule says. Main is protected: nothing lands without
# the verifier and the human gate.
#
# A claim that is not placeable (it paid less than its block's tier price) is
# listed and stays pending; no block is consumed for it.

on:
  push:
    branches: [main]
    paths:
      - 'ledger/claims/**'
      - 'ledger/w1/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: assign-slots
  cancel-in-progress: false

jobs:
  assign:
    name: Place pending claims
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow==12.3.0" "jsonschema==4.26.0" "rfc3339-validator==0.1.4" "rfc3987==1.3.8" "eth-account==0.13.7"

      - name: Show the placement plan
        run: python scripts/assign_slots.py --dry-run

      - name: Place pending claims and regenerate the state
        run: python scripts/assign_slots.py

      - name: Verify the result with the ledger's own verifier
        env:
          TFW_DIFF_RANGE: ${{ github.sha }}...HEAD
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing placed; nothing to verify."
            exit 0
          fi
          git add -A ledger state.json canvas
          git -c user.name=the-first-wall-bot -c user.email=bot@thefirstwall.ai commit -q -m "assign: place pending claims"
          python scripts/verifier.py --rpc-scope changed
          python scripts/generate_state.py --check
          python scripts/generate_spec.py --check

      - name: Open the assignment pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]; then
            echo "No placement to propose."
            exit 0
          fi
          BRANCH="assign/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "assign: place pending claims" \
            --body "$(printf 'Automated assignment of pending claims in settlement order (scripts/assign_slots.py) for main at %s.\n\nThe base-branch verifier re-derives this placement (verify_assignment); merge when green.' "${GITHUB_SHA}")"
