name: Issue an absence certificate

# A signed negative proof: "no record for this wallet at root <root>, anchored in
# block <n>, as of <t>" (scripts/absence_certificate.py, spec.md §2.21). Issued on
# demand for one wallet, only for the current root and only once that root is
# anchored. Signed by the anchor signer (ADDRESSES.md row 4) via the existing
# ANCHOR_PRIVATE_KEY secret, which never leaves this job. The certificate lands
# through a pull request (main is protected); the web mirror serves absent/.

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: "The wallet to certify as absent (0x + 40 hex)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: absence-certificate
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "eth-account==0.13.7"

      - name: Sign the certificate
        env:
          WALLET: ${{ inputs.wallet }}
          ANCHOR_PRIVATE_KEY: ${{ secrets.ANCHOR_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WALLET" | grep -Eq '^0x[0-9a-fA-F]{40}$'; then
            echo "::error::not a wallet address"; exit 1
          fi
          if [ -z "$ANCHOR_PRIVATE_KEY" ]; then
            echo "::error::ANCHOR_PRIVATE_KEY secret is not set"; exit 1
          fi
          python scripts/absence_certificate.py "$WALLET" --key-env ANCHOR_PRIVATE_KEY
          python scripts/absence_certificate.py --verify "absent/$(printf '%s' "$WALLET" | tr 'A-F' 'a-f').json"

      - name: Open PR with the certificate
        env:
          GH_TOKEN: ${{ github.token }}
          WALLET: ${{ inputs.wallet }}
        run: |
          set -euo pipefail
          W="$(printf '%s' "$WALLET" | tr 'A-F' 'a-f')"
          git config user.name "the-first-wall-bot"
          git config user.email "bot@thefirstwall.ai"
          BRANCH="absent/${W}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add "absent/${W}.json"
          git commit -m "absent: certificate for ${W}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "absent: certificate for ${W}" \
            --body "Signed absence certificate (scripts/absence_certificate.py) for ${W} at the current anchored root."
