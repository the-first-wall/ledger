name: Verify Inscription & Merkle State

on:
  pull_request:
    paths:
      - 'ledger/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'state.json'
      - '.github/workflows/**'
  push:
    branches: [main]

jobs:
  verify:
    name: Deterministic Settlement & Schema Verifier
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the PR-containment diff can resolve origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run Deterministic Offline Verifier
        run: |
          python scripts/verifier.py

      - name: Enforce state-root drift gate
        run: |
          python scripts/generate_state.py --check
