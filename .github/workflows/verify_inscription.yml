name: Verify Inscription & Merkle State

on:
  pull_request:
    paths:
      - 'ledger/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'state.json'
      - '.github/workflows/**'
  push:
    branches: [main]

jobs:
  verify:
    name: Deterministic Settlement & Schema Verifier
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the PR-containment diff can resolve origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run Deterministic Offline Verifier
        run: |
          python scripts/verifier.py --report verification-report.json

      - name: Enforce state-root drift gate
        run: |
          python scripts/generate_state.py --check

      - name: Publish verification report (job summary)
        if: always()
        run: |
          if [ -f verification-report.json ]; then
            {
              echo "## The First Wall — Verification Report"
              python - <<'PY'
import json
d = json.load(open("verification-report.json"))
print(f"**Result: {d['result']}** · slots: {d['slots_validated']} · merkle: `{d['merkle_root'][:16]}…`")
print("")
print("| check | status | detail |")
print("| :--- | :--- | :--- |")
for c in d["checks"]:
    print(f"| `{c['check']}` | {c['status']} | {c['detail'][:100]} |")
PY
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.json
          if-no-files-found: ignore
