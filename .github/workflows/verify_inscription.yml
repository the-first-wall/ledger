name: Verify Inscription & Merkle State

on:
  pull_request:
    paths:
      - 'ledger/**'
      - 'schemas/**'
  push:
    branches: [main]

jobs:
  verify:
    name: Deterministic Settlement & Schema Verifier
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow web3 eth-account

      - name: Run Deterministic Offline Verifier
        run: |
          python scripts/verifier.py
