name: Notify the site

# The site (the-first-wall/web) mirrors this ledger. It syncs on a schedule, but GitHub
# runs scheduled workflows late and unevenly (hours, in practice), so a merge here could
# take hours to reach thefirstwall.ai. This asks the site to sync right after every push to
# main (a claim, an update, an anchor, a documentation change), using the site's own
# `workflow_dispatch` trigger. Nothing is pushed or changed here.
#
# Needs one repository secret, WEB_SYNC_TOKEN: a fine-grained personal access token with
#   resource owner   the-first-wall
#   repository       web (only)
#   permission       Actions: Read and write
# Without the secret this job says so and succeeds: the site then syncs on its own schedule,
# as it did before. The token can start a workflow in `web` and nothing else; the sync it
# starts verifies the ledger first and publishes nothing from a ledger that fails its checks.
#
# Runs on push to main only, never on a pull request, so the secret is not exposed to a
# change that has not been merged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: notify-site
  cancel-in-progress: true

jobs:
  notify:
    name: Ask the site to sync
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the site's sync
        env:
          WEB_SYNC_TOKEN: ${{ secrets.WEB_SYNC_TOKEN }}
        run: |
          set -eu
          if [ -z "${WEB_SYNC_TOKEN}" ]; then
            echo "::notice::WEB_SYNC_TOKEN is not set; the site syncs on its own schedule."
            exit 0
          fi
          status=$(curl -sS -o /tmp/response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${WEB_SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/the-first-wall/web/actions/workflows/sync-from-ledger.yml/dispatches \
            -d '{"ref":"main"}')
          if [ "${status}" != "204" ]; then
            echo "::warning::the site's sync was not started (HTTP ${status}); it syncs on its own schedule."
            cat /tmp/response.txt
            exit 0
          fi
          echo "The site's sync was started."
