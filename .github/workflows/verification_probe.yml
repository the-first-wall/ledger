name: Verification probe (live endpoints)

# E-10: the ONLY place the live HTTP probes run (never unit tests, never --check).
# Writes verification.json with timestamped GETs of the x402 manifest and the
# canonical state.json, then publishes it the same way settlement_watch.yml does:
# direct commit to main, falling back to one bot/verification PR if main rejects
# the push. Read-only; no secrets beyond GITHUB_TOKEN.
#
# Optional secret LEDGER_BOT_TOKEN (fine-grained PAT: this repo, Contents: write,
# Pull requests: write). GitHub opens pull_request runs triggered by the built-in
# GITHUB_TOKEN in an approval-required state, so a bot-authored PR would sit with
# Self-check / Verify-from-base never running. With the PAT the branch push and
# the PR are attributed to a real user and every pull_request workflow runs
# automatically. Without it the PR is still published, with a notice.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: verification-probe
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # workflow_dispatch on the fallback branch (no PAT needed)

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow==12.3.0" "jsonschema==4.26.0" "rfc3339-validator==0.1.4" "rfc3987==1.3.8" "eth-account==0.13.7"

      - name: Probe and write verification.json
        id: probe
        run: |
          set +e
          python scripts/verification.py --probe
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish verification.json
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.LEDGER_BOT_TOKEN }}
        run: |
          git config user.name "the-first-wall-bot"
          git config user.email "bot@thefirstwall.ai"
          git add verification.json
          if git diff --cached --quiet; then
            echo "verification.json unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "ops: verification.json probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          if git push origin HEAD:main; then
            echo "Published directly to main." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Push to main rejected; falling back to bot/verification PR." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "${BOT_TOKEN}" ]; then
              export GH_TOKEN="${BOT_TOKEN}"
              PUSH_URL="https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            else
              echo "::notice::LEDGER_BOT_TOKEN is not set: the bot/verification PR is authored by GITHUB_TOKEN, so Self-check and Verify-from-base will wait for a human approval. Set the secret to let them run automatically." | tee -a "$GITHUB_STEP_SUMMARY"
              PUSH_URL="origin"
            fi
            git push --force "${PUSH_URL}" HEAD:refs/heads/bot/verification
            if [ -z "$(gh pr list --head bot/verification --state open --json number --jq '.[0].number')" ]; then
              gh pr create --base main --head bot/verification \
                --title "ops: verification.json probe" \
                --body "Automated live-endpoint probe (.github/workflows/verification_probe.yml)."
            fi
            if [ -z "${BOT_TOKEN}" ]; then
              # A PR opened with GITHUB_TOKEN has its pull_request runs held for
              # approval, so nothing would verify it. workflow_dispatch runs
              # regardless of the author, so start both checks on the branch.
              gh workflow run verify_inscription.yml --ref bot/verification -f rpc_scope=changed
              gh workflow run self_check.yml --ref bot/verification
              echo "Checks dispatched on bot/verification (no PAT required)." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Fail visibly if a check failed
        if: ${{ steps.probe.outputs.code != '0' }}
        run: |
          echo "::error::a verification check failed; see verification.json."
          exit 1
